# Publishes the site to GitHub Pages (https://<user>.github.io/<repo>/) on every
# push to main. The site is static, so no server is needed there — server.js is
# only used for Railway. One-time setup: repo Settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Check my-igcse.html is up to date
        run: |
          npm run build
          git diff --exit-code my-igcse.html || (echo "::error::my-igcse.html is out of date. Run 'npm run build' and commit it." && exit 1)

      - name: Collect public files
        run: |
          mkdir _site
          cp -r index.html my-igcse.html favicon.svg manifest.webmanifest LICENSE css js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
